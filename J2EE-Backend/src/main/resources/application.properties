# ==========================================
# APPLICATION CONFIGURATION (LOCAL DEVELOPMENT)
# ==========================================

spring.application.name=J2EE-Backend

# Profile: dev, prod (Set env variable SPRING_PROFILES_ACTIVE=prod for production)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.servlet.context-path=/api

# Trust X-Forwarded-* headers (cần thiết khi chạy sau reverse proxy)
server.forward-headers-strategy=framework

# ==========================================
# DATABASE CONFIGURATION
# ==========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/datvemaybay?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JWT CONFIGURATION
# ==========================================
jwt.secret=${JWT_SECRET:}
jwt.access-expiration=300000
jwt.refresh-expiration=2592000000

# ==========================================
# CORS CONFIGURATION
# ==========================================
# Local development
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ==========================================
# FLYWAY CONFIGURATION
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.encoding=UTF-8
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=false
spring.flyway.clean-disabled=true

# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# ==========================================
# LOGGING CONFIGURATION
# ==========================================
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.ai=DEBUG
logging.level.org.springframework.web.client=DEBUG
logging.level.com.example.j2ee.service=DEBUG
logging.level.com.example.j2ee.controller=DEBUG

# ==========================================
# API KEYS
# ==========================================
airportdb.api.key=${AIRPORTDB_API_KEY:}

# ==========================================
# SPRING AI CONFIGURATION - OpenRouter
# ==========================================
spring.ai.openai.api-key=${OPENROUTER_API_KEY:}
spring.ai.openai.base-url=${OPENROUTER_BASE_URL:}
spring.ai.openai.chat.options.model=${OPENROUTER_MODEL:}
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.chat.options.max-tokens=4096

# ==========================================
# GOOGLE OAUTH2 CONFIGURATION
# ==========================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid, profile, email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ==========================================
# EMAIL CONFIGURATION (Custom SMTP via .env)
# ==========================================
spring.mail.host=${EMAIL_SMTP_HOST:smtp.gmail.com}
spring.mail.port=${EMAIL_SMTP_PORT:587}
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.ssl.enable=${EMAIL_ENABLE_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

app.mail.from=${EMAIL_FROM:noreply@jadtairline.com}
app.mail.from-name=${EMAIL_FROM_NAME:}

# ==========================================
# FRONTEND URL CONFIGURATION
# ==========================================
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# ==========================================
# AI ADVISOR CONFIGURATION (9router, OpenAI-compatible)
# Gateway chạy local: http://localhost:20128/v1
# ==========================================
advisor.llm.base-url=${ADVISOR_BASE_URL:http://localhost:20128/v1}
advisor.llm.api-key=${ADVISOR_API_KEY:sk-f3a6cbe4c7c71def-gx0mc7-11a29de6}
advisor.llm.model=${ADVISOR_MODEL:wq}
advisor.llm.temperature=0.7
advisor.llm.max-tokens=1024

# ==========================================
# AI SUGGESTION CONFIGURATION
# ==========================================
ai.suggestion.max-context-messages=20
ai.suggestion.trigger-on=customer-message-only

# ==========================================
# FILE UPLOAD CONFIGURATION
# ==========================================
file.upload-dir=${UPLOAD_DIR:uploads}
